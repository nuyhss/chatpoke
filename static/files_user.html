<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>틸론AI 파일 업로드</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f5f7fb;
            --panel: rgba(255,255,255,.94);
            --panel-2: #f3f6fb;
            --border: #d9e2f0;
            --text: #10213a;
            --subtle: #5d6c83;
            --accent: #2563eb;
            --accent-2: #3b82f6;
        }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: linear-gradient(180deg, #f8fbff 0%, #eef3fb 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }
        .shell { max-width: 1180px; margin: 0 auto; }
        .topbar, .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 22px 24px;
            margin-bottom: 18px;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand img { width: 46px; height: auto; }
        .brand h1 { font-size: 28px; margin-bottom: 4px; }
        .brand p { font-size: 14px; color: var(--subtle); }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--subtle);
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font: inherit;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
        .grid {
            display: grid;
            grid-template-columns: 1.2fr .8fr;
            gap: 18px;
        }
        .card { padding: 24px; }
        .card h2 { font-size: 22px; margin-bottom: 12px; }
        .card p { color: var(--subtle); line-height: 1.7; }
        .placeholder {
            margin-top: 18px;
            border: 1px dashed var(--border);
            border-radius: 16px;
            background: var(--panel-2);
            min-height: 260px;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 24px;
            color: var(--subtle);
            line-height: 1.8;
        }
        .meta-list { display: grid; gap: 12px; }
        .meta-item {
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
        }
        .meta-label {
            font-size: 12px;
            color: var(--subtle);
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-bottom: 4px;
        }
        .meta-value { font-size: 16px; font-weight: 600; }
        .notice {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(37,99,235,.08);
            color: var(--accent);
            line-height: 1.7;
        }
        @media (max-width: 920px) {
            body { padding: 16px; }
            .topbar { flex-direction: column; align-items: flex-start; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand">
                <img src="/static/swf-logo.svg?v=2" alt="틸론AI 로고">
                <div>
                    <h1>파일 업로드</h1>
                    <p>일반 사용자가 파일 업로드를 신청하는 화면입니다.</p>
                </div>
            </div>
            <div class="actions">
                <button class="btn" type="button" onclick="window.location.href='/chat/login'">챗봇 사이트</button>
                <button class="btn primary" type="button" id="logout-btn">로그아웃</button>
            </div>
        </header>

        <main class="grid">
            <section class="card">
                <h2>파일 업로드 신청</h2>
                <p>이 영역에 일반 직원용 업로드 신청 UI를 붙이면 됩니다. public/private 선택, 공개 대상 지정, 신청 이력 조회 같은 기능이 여기에 들어갑니다.</p>
                <div class="placeholder">
                    <div>
                        <strong>향후 구현 위치</strong><br>
                        PDF 업로드, 공개 범위 설정, 선택 부서/선택 직원 지정, 내 신청 목록
                    </div>
                </div>
            </section>

            <aside class="card">
                <h2>접속 정보</h2>
                <div class="meta-list">
                    <div class="meta-item">
                        <div class="meta-label">아이디</div>
                        <div class="meta-value" id="user-name">불러오는 중...</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">권한</div>
                        <div class="meta-value" id="user-role">불러오는 중...</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">부서</div>
                        <div class="meta-value" id="user-department">불러오는 중...</div>
                    </div>
                </div>
                <div class="notice">
                    관리자 권한 사용자는 자동으로 관리자 전용 파일 사이트로 이동합니다.
                </div>
            </aside>
        </main>
    </div>

    <script>
        const API = window.location.origin;
        const ADMIN_ROLES = new Set(["adminD", "admin"]);

        function roleDisplayLabel(role) {
            if (role === "adminD") return "최고 관리자";
            if (role === "admin") return "관리자";
            if (role === "user") return "사용자";
            return role || "-";
        }

        async function readJsonSafe(response) {
            try {
                return await response.json();
            } catch {
                return {};
            }
        }

        async function fetchCurrentUser() {
            try {
                const response = await fetch(API + "/auth/me", { credentials: "same-origin" });
                if (!response.ok) return null;
                const data = await readJsonSafe(response);
                return data.user || null;
            } catch {
                return null;
            }
        }

        async function logout() {
            try {
                await fetch(API + "/auth/logout", {
                    method: "POST",
                    credentials: "same-origin"
                });
            } catch {}
            window.location.replace("/files/login");
        }

        document.getElementById("logout-btn").addEventListener("click", logout);

        (async () => {
            const user = await fetchCurrentUser();
            if (!user) {
                window.location.replace("/files/login");
                return;
            }
            if (ADMIN_ROLES.has(user.role)) {
                window.location.replace("/files/admin");
                return;
            }
            document.getElementById("user-name").textContent = user.username || "-";
            document.getElementById("user-role").textContent = roleDisplayLabel(user.role);
            document.getElementById("user-department").textContent = user.department || "-";
        })();
    </script>
</body>
</html>
